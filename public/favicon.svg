<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="soGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.5)" />
      <stop offset="100%" stop-color="rgba(37,99,235,0.2)" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado oscuro -->
  <rect width="64" height="64" rx="16" fill="#070A11" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="2" />
  
  <!-- Monograma SO -->
  <text 
    x="32" 
    y="43" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="28" 
    font-weight="800" 
    letter-spacing="-1.5" 
    fill="url(#soGradient)" 
    text-anchor="middle"
  >
    SO
